plugins
{
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.21'
}
version = project.mod_version
group = project.mod_group_id
base { archivesName = project.mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
sourceSets.main.resources { srcDir 'src/generated/resources' }
def replaceProperties = [
    loader_version_range: project.loader_version_range,
    minecraft_version: project.minecraft_version,
    minecraft_version_range: project.minecraft_version_range,
    neo_version: project.neo_version,
    mod_id: project.mod_id,
    mod_name: project.mod_name,
    mod_license: project.mod_license,
    mod_version: project.mod_version,
    mod_authors: project.mod_authors,
    mod_description: project.mod_description
]
tasks.named('processResources', ProcessResources).configure {
    inputs.properties(replaceProperties)
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand(replaceProperties)
    }
}
repositories
{
    maven { url = "https://cursemaven.com" }
    maven { url = "https://maven.blamejared.com" }
}
dependencies
{
    implementation "net.neoforged:neoforge:${neo_version}"
    compileOnly "curse.maven:bookshelf-228525:7606240"
    compileOnly "curse.maven:botany-pots-353928:7115287"
    compileOnly "curse.maven:emi-580555:6420931"
    implementation "curse.maven:balm-531761:7420963"
    implementation "curse.maven:farming-for-blockheads-261924:7652500"
    localRuntime "curse.maven:architectury-api-419699:5786327"
    localRuntime "curse.maven:bookshelf-228525:7606240"
    localRuntime "curse.maven:botany-pots-353928:7115287"
    localRuntime "curse.maven:emi-580555:6420931"
    localRuntime "curse.maven:prickle-1023259:6961457"
    localRuntime "curse.maven:tmrv-1194921:7785753"
}
runs
{
    client { systemProperties.put('neoforge.enabledGameTestNamespaces', project.mod_id.toString()) }
    server
    {
        systemProperties.put('neoforge.enabledGameTestNamespaces', project.mod_id.toString())
        arguments.add('--nogui')
    }
    gameTestServer { systemProperties.put('neoforge.enabledGameTestNamespaces', project.mod_id.toString()) }
    data
    {
        workingDirectory = project.file('run-data')
        arguments.addAll(['--mod', project.mod_id.toString(), '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()])
    }
}